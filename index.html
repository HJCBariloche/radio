<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADIO S.C.BARILOCHE - Global Radio Explorer</title>
  <script src="//unpkg.com/globe.gl"></script>
  <style>
    body { margin: 0; background-color: #02040a; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    
    /* Mirilla central dorada */
    .crosshair {
      position: absolute; top: 50%; left: 50%; width: 28px; height: 28px;
      transform: translate(-50%, -50%); border: 2px solid rgba(255, 170, 0, 0.9);
      border-radius: 50%; pointer-events: none; z-index: 10;
      box-shadow: 0 0 16px rgba(255, 170, 0, 0.8);
    }
    .crosshair::after {
      content: ''; position: absolute; top: 50%; left: 50%; width: 5px; height: 5px;
      background-color: #ffaa00; border-radius: 50%; transform: translate(-50%, -50%);
    }

    /* Buscador y desplegable superior */
    .search-container {
      position: absolute; top: 20px; left: 20px; z-index: 30;
      display: flex; flex-direction: column; gap: 10px; max-width: 640px; width: calc(100% - 280px);
    }
    .search-row { display: flex; gap: 10px; width: 100%; align-items: center; }
    
    .search-input {
      flex: 1; padding: 12px 18px; border-radius: 24px;
      border: 1.5px solid rgba(255, 170, 0, 0.5); background: rgba(12, 16, 28, 0.95);
      backdrop-filter: blur(12px); color: #fff; font-size: 15px; outline: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6); transition: all 0.2s;
    }
    .search-input:focus { border-color: #ffaa00; box-shadow: 0 0 14px rgba(255, 170, 0, 0.5); }
    .search-input::placeholder { color: #8a99ad; }
    
    /* Selector de Géneros Moderno */
    .genre-select {
      padding: 12px 20px; border-radius: 24px;
      border: 1.5px solid rgba(255, 170, 0, 0.5); background: rgba(12, 16, 28, 0.95);
      backdrop-filter: blur(12px); color: #ffaa00; font-size: 15px; font-weight: 700;
      outline: none; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='%23ffaa00' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat; background-position: right 12px center; padding-right: 38px;
      transition: all 0.2s;
    }
    .genre-select:hover { border-color: #ffaa00; background-color: rgba(22, 30, 50, 0.95); }
    .genre-select option { background-color: #0c101c; color: #fff; font-size: 15px; padding: 10px; }

    .geo-btn {
      width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid rgba(255, 170, 0, 0.5);
      background: rgba(12, 16, 28, 0.95); backdrop-filter: blur(12px); color: #ffaa00;
      font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6); transition: transform 0.2s;
    }
    .geo-btn:hover { transform: scale(1.08); border-color: #ffaa00; }

    /* Sugerencias desplegables del buscador */
    .results-dropdown {
      background: rgba(12, 16, 28, 0.96); border: 1.5px solid rgba(255, 170, 0, 0.5);
      border-radius: 16px; max-height: 200px; overflow-y: auto; display: none;
      backdrop-filter: blur(12px); box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    }
    .results-item {
      padding: 12px 16px; font-size: 14px; color: #ddd; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .results-item:hover { background: rgba(255, 170, 0, 0.2); color: #ffaa00; }

    /* Panel de Favoritos */
    .fav-panel {
      position: absolute; top: 20px; right: 20px; background: rgba(12, 16, 28, 0.95);
      backdrop-filter: blur(12px); border: 1.5px solid rgba(255, 170, 0, 0.4);
      border-radius: 16px; padding: 14px 18px; z-index: 30; width: 220px; max-height: 250px; overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    }
    .fav-panel h3 { margin: 0 0 10px 0; font-size: 14px; color: #ffaa00; letter-spacing: 0.5px; }
    .fav-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; color: #ccc; }
    .fav-item:hover { color: #ffaa00; }

    /* Tarjeta inferior dorada */
    .card {
      position: absolute; bottom: 24px; left: 24px; background: rgba(12, 16, 28, 0.95);
      backdrop-filter: blur(12px); padding: 20px 24px; border-radius: 18px;
      border: 1.5px solid rgba(255, 170, 0, 0.5); z-index: 30; min-width: 330px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .status-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #ffaa00; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
    .card h2 { margin: 0 0 4px 0; font-size: 18px; font-weight: 700; color: #fff; }
    .card p { margin: 2px 0; font-size: 13px; color: #8a99ad; }
    .distance-tag { font-size: 13px; color: #ffaa00; font-weight: 700; margin-top: 6px; display: block; }
    .hint-tag { font-size: 11px; color: #667788; margin-top: 4px; display: block; font-style: italic; }
    
    .controls { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .btn { background: #ffaa00; border: none; color: #02040a; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; transition: all 0.2s; }
    .btn:hover { background: #ffc44d; transform: scale(1.03); }
    .random-btn { background: rgba(255, 170, 0, 0.18); border: 1.5px solid rgba(255, 170, 0, 0.6); color: #ffaa00; padding: 9px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.2s; }
    .random-btn:hover { background: rgba(255, 170, 0, 0.35); transform: scale(1.03); }
    .fav-btn { background: transparent; border: 1.5px solid rgba(255, 170, 0, 0.6); color: #ffaa00; padding: 9px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .fav-btn.active { background: #ffaa00; color: #02040a; }

    /* Título perfectamente centrado en el box inferior derecho */
    .branding-box {
      position: absolute; bottom: 24px; right: 24px; z-index: 999;
      background: rgba(12, 16, 28, 0.92); backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 170, 0, 0.6); border-radius: 16px;
      padding: 12px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .branding-title {
      font-size: 18px; font-weight: 800; color: #ffaa00; letter-spacing: 1.5px;
      text-transform: uppercase; margin: 0; text-shadow: 0 0 12px rgba(255, 170, 0, 0.6);
      text-align: center; width: 100%;
    }
    .branding-sub {
      font-size: 11px; color: #8a99ad; margin: 3px 0 0 0; letter-spacing: 0.8px; font-weight: 600; text-align: center; width: 100%;
    }

    /* Ecualizador dorado */
    .eq { display: flex; gap: 3px; height: 12px; align-items: flex-end; margin-left: auto; }
    .eq-bar { width: 3px; background: #ffaa00; animation: eqAnim 0.8s infinite alternate; }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    @keyframes eqAnim { 0% { height: 2px; } 100% { height: 12px; } }
  </style>
</head>
<body>
  <div class="search-container">
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar emisora o país (Enter)..." onkeydown="handleSearchKey(event)" autocomplete="off">
      <select id="genreSelect" class="genre-select" onchange="filterByGenre(this.value)">
        <option value="all">🎵 Todos los géneros</option>
        <option value="lentos">💕 Lentos / Baladas</option>
        <option value="folklore">🪗 Folklore</option>
        <option value="rock">🎸 Rock</option>
        <option value="pop">🎤 Pop</option>
        <option value="80s">📻 Años 80s / Retro</option>
        <option value="jazz">🎷 Jazz</option>
        <option value="tango">💃 Tango</option>
        <option value="cumbia">🪘 Cumbia / Tropical</option>
        <option value="reggae">🌴 Reggae / Chill</option>
        <option value="news">📰 Noticias</option>
        <option value="electronic">🎧 Electrónica</option>
        <option value="classical">🎻 Clásica</option>
        <option value="sports">⚽ Deportes</option>
      </select>
      <button class="geo-btn" onclick="locateOrigin()" title="Ir a mi origen">🏔️</button>
    </div>
    <div id="searchResults" class="results-dropdown"></div>
  </div>

  <div class="fav-panel">
    <h3>⭐ MIS FAVORITAS</h3>
    <div id="favList"></div>
  </div>

  <div class="crosshair"></div>

  <div class="card">
    <div class="status-badge">
      <span>● SINTONIZANDO</span>
      <div class="eq" id="eqBars" style="display:none;">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
    </div>
    <h2 id="name">Buscando emisoras...</h2>
    <p id="country">-</p>
    <span id="distance" class="distance-tag"></span>
    <span class="hint-tag">💡 Mové el globo y hacé doble clic para cambiar de radio</span>
    <div class="controls">
      <button class="btn" id="playBtn" onclick="toggleAudio()">▶ Reprod.</button>
      <button class="random-btn" onclick="playRandomStation()" title="Radio Aleatoria">🎲 Sorpréndeme</button>
      <button class="fav-btn" id="favBtn" onclick="toggleFavorite()">♡ Guardar</button>
    </div>
  </div>

  <!-- Cartel centrado -->
  <div class="branding-box">
    <h1 class="branding-title">RADIO S.C.BARILOCHE</h1>
    <p class="branding-sub">PATAGONIA ARGENTINA • GLOBAL EXPLORER</p>
  </div>

  <div id="globe"></div>

  <script>
    let stations = [], currentStation = null, selectedGenre = 'all';
    
    const BARILOCHE = { lat: -41.1335, lng: -71.3103, label: 'Bariloche' };
    let userOrigin = { ...BARILOCHE };

    let audio = new Audio();
    let favorites = JSON.parse(localStorage.getItem('myRadioFavorites')) || [];

    // Inyección garantizada de "La Radio de los Lentos"
    const CUSTOM_STATIONS = [
      {
        name: "La Radio de los Lentos",
        country: "Argentina",
        tags: "lentos baladas romantic love 80s 90s pop",
        lat: -34.6037,
        lng: -58.3816,
        url: "https://stream.zeno.fm/f3wvbb7534zuv"
      }
    ];

    function getKilometers(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    function isMatchGenre(station) {
      if (selectedGenre === 'all') return true;
      return station.tags.includes(selectedGenre) || station.name.toLowerCase().includes(selectedGenre);
    }

    const world = Globe()(document.getElementById('globe'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .pointColor(s => isMatchGenre(s) ? '#ffaa00' : 'rgba(255, 170, 0, 0.12)')
      .pointAltitude(s => isMatchGenre(s) ? 0.003 : 0.001)
      .pointRadius(s => isMatchGenre(s) ? 0.07 : 0.02)
      .pointResolution(6)
      .polygonCapColor(() => 'rgba(0,0,0,0)')
      .polygonSideColor(() => 'rgba(0,0,0,0)')
      .polygonStrokeColor(() => 'rgba(255, 170, 0, 0.25)')
      .arcColor(() => ['#ffaa00', 'rgba(255, 170, 0, 0.1)'])
      .arcAltitude(0.28)
      .arcDashLength(0.4)
      .arcDashGap(0.2)
      .arcDashAnimateTime(1200)
      .arcStroke(1.2)
      .onPointClick((point) => tuneStation(point));

    fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
      .then(res => res.json())
      .then(countries => world.polygonsData(countries.features));

    world.pointOfView({ lat: userOrigin.lat, lng: userOrigin.lng, altitude: 0.9 });

    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userOrigin = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            label: 'tu ubicación'
          };
          if (currentStation) tuneStation(currentStation);
        },
        () => { userOrigin = { ...BARILOCHE }; }
      );
    }

    fetch('https://de1.api.radio-browser.info/json/stations/search?limit=8000&has_geo_info=true&order=votes&reverse=true')
      .then(r => r.json())
      .then(data => {
        const fetched = data.map(s => ({ 
          name: s.name.trim(), 
          country: s.country, 
          tags: s.tags ? s.tags.toLowerCase() : '',
          lat: parseFloat(s.geo_lat), 
          lng: parseFloat(s.geo_long), 
          url: s.url_resolved 
        })).filter(s => 
          !isNaN(s.lat) && !isNaN(s.lng) && 
          Math.abs(s.lat) <= 90 && Math.abs(s.lng) <= 180 &&
          !(Math.abs(s.lat) < 0.1 && Math.abs(s.lng) < 0.1)
        );

        stations = [...CUSTOM_STATIONS, ...fetched];

        world.pointsData(stations);
        tuneNearestToCenter();
        updateFavoritesUI();
      });

    function tuneStation(station) {
      if (!station) return;
      currentStation = station;

      const distFromOrigin = getKilometers(userOrigin.lat, userOrigin.lng, station.lat, station.lng);

      document.getElementById('name').innerText = station.name;
      document.getElementById('country').innerText = `📍 ${station.country}`;
      document.getElementById('distance').innerText = `📐 A ${distFromOrigin.toLocaleString('es-AR')} km de ${userOrigin.label}`;

      world.arcsData([{
        startLat: userOrigin.lat, startLng: userOrigin.lng,
        endLat: station.lat, endLng: station.lng
      }]);

      audio.src = station.url;
      audio.play().then(() => setPlayingState(true)).catch(() => setPlayingState(false));
      updateFavoritesUI();
    }

    function tuneNearestToCenter() {
      const activeList = stations.filter(s => isMatchGenre(s));
      if (!activeList.length) return;
      
      const center = world.pointOfView();
      let nearest = null, minCenterDist = Infinity;

      for (const s of activeList) {
        const d = getKilometers(center.lat, center.lng, s.lat, s.lng);
        if (d < minCenterDist) { 
          minCenterDist = d; 
          nearest = s; 
        }
      }
      if (nearest) tuneStation(nearest);
    }

    function playRandomStation() {
      const activeList = stations.filter(s => isMatchGenre(s));
      if (!activeList.length) return;
      const randomIdx = Math.floor(Math.random() * activeList.length);
      const station = activeList[randomIdx];
      flyAndTune(station);
    }

    function filterByGenre(genre) {
      selectedGenre = genre;
      world.pointColor(s => isMatchGenre(s) ? '#ffaa00' : 'rgba(255, 170, 0, 0.12)')
           .pointAltitude(s => isMatchGenre(s) ? 0.003 : 0.001)
           .pointRadius(s => isMatchGenre(s) ? 0.07 : 0.02);
    }

    document.getElementById('globe').addEventListener('dblclick', () => {
      tuneNearestToCenter();
    });

    function handleSearchKey(e) {
      const q = e.target.value.toLowerCase().trim();
      const dropdown = document.getElementById('searchResults');
      
      if (e.key === 'Enter') {
        if (!q) return;
        const matches = stations.filter(s => s.name.toLowerCase().includes(q) || s.country.toLowerCase().includes(q));
        if (matches.length > 0) {
          dropdown.style.display = 'none';
          flyAndTune(matches[0]);
        }
        return;
      }

      if (q.length >= 2) {
        const matches = stations.filter(s => s.name.toLowerCase().includes(q) || s.country.toLowerCase().includes(q)).slice(0, 5);
        if (matches.length > 0) {
          dropdown.innerHTML = matches.map(s => `<div class="results-item" onclick="selectSearchItem('${s.url}')">📻 ${s.name} (${s.country})</div>`).join('');
          dropdown.style.display = 'block';
        } else {
          dropdown.style.display = 'none';
        }
      } else {
        dropdown.style.display = 'none';
      }
    }

    function selectSearchItem(url) {
      const station = stations.find(s => s.url === url);
      if (station) {
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('searchInput').value = station.name;
        flyAndTune(station);
      }
    }

    function flyAndTune(station) {
      world.pointOfView({ lat: station.lat, lng: station.lng, altitude: 0.8 }, 2000);
      setTimeout(() => tuneStation(station), 2100);
    }

    function setPlayingState(isPlaying) {
      document.getElementById('playBtn').innerText = isPlaying ? '⏸ Pausa' : '▶ Reprod.';
      document.getElementById('eqBars').style.display = isPlaying ? 'flex' : 'none';
    }

    function toggleAudio() {
      if (audio.paused) { audio.play(); setPlayingState(true); }
      else { audio.pause(); setPlayingState(false); }
    }

    function locateOrigin() {
      world.pointOfView({ lat: userOrigin.lat, lng: userOrigin.lng, altitude: 0.9 }, 2000);
      setTimeout(tuneNearestToCenter, 2100);
    }

    function toggleFavorite() {
      if (!currentStation) return;
      const index = favorites.findIndex(f => f.url === currentStation.url);
      if (index >= 0) { favorites.splice(index, 1); }
      else { favorites.push({ name: currentStation.name, country: currentStation.country, lat: currentStation.lat, lng: currentStation.lng, url: currentStation.url }); }
      localStorage.setItem('myRadioFavorites', JSON.stringify(favorites));
      updateFavoritesUI();
    }

    function updateFavoritesUI() {
      const favBtn = document.getElementById('favBtn');
      const favList = document.getElementById('favList');
      if (currentStation) {
        const isFav = favorites.some(f => f.url === currentStation.url);
        favBtn.classList.toggle('active', isFav);
        favBtn.innerText = isFav ? '♥ Guardado' : '♡ Guardar';
      }
      favList.innerHTML = favorites.length === 0 ? '<p style="font-size:11px; color:#666; margin:0;">Sin favoritos</p>' : '';
      favorites.forEach((fav) => {
        const div = document.createElement('div');
        div.className = 'fav-item';
        div.innerHTML = `<span onclick="flyAndTune(${JSON.stringify(fav).replace(/"/g, '&quot;')})" style="cursor:pointer">📻 ${fav.name}</span>`;
        favList.appendChild(div);
      });
    }
  </script>
</body>
</html>
