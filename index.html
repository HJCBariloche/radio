<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio S.C. Bariloche - Global Explorer</title>
  
  <!-- Tipografía legible Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Librería 3D Globe -->
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030508;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
    }

    #globe-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* BARRA SUPERIOR */
    .top-bar {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .top-controls-left {
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
    }

    .search-container {
      position: relative;
      width: 320px;
    }

    .search-input {
      width: 100%;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 25px;
      padding: 12px 20px;
      color: #fff;
      font-size: 16px; /* Letra grande */
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: #ffaa00;
      box-shadow: 0 0 15px rgba(255, 170, 0, 0.4);
    }

    .search-results {
      position: absolute;
      top: 115%;
      left: 0;
      right: 0;
      background: rgba(13, 17, 23, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      max-height: 280px;
      overflow-y: auto;
      display: none;
      z-index: 20;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .results-item {
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: background 0.15s ease;
    }

    .results-item:hover {
      background: rgba(255, 170, 0, 0.25);
      color: #ffaa00;
    }

    .btn-top, .select-top {
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 25px;
      padding: 12px 20px;
      color: #fff;
      font-size: 15px; /* Letra grande */
      font-weight: 600;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-top:hover, .select-top:hover {
      border-color: #ffaa00;
      color: #ffaa00;
    }

    .btn-top.active {
      background: #ffaa00;
      color: #000;
      font-weight: 700;
    }

    /* PANEL FAVORITOS */
    .fav-panel {
      pointer-events: auto;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 16px 20px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .fav-title {
      font-size: 15px;
      font-weight: 800;
      color: #ffaa00;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .fav-list {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .fav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      padding: 6px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    .fav-item:hover {
      color: #ffaa00;
    }

    .fav-remove {
      color: #ff5555;
      font-weight: bold;
      padding: 2px 8px;
      cursor: pointer;
      border-radius: 4px;
    }

    .fav-remove:hover {
      background: rgba(255, 85, 85, 0.2);
    }

    /* TARJETA DE REPRODUCCIÓN (INFERIOR IZQUIERDA) */
    .player-card {
      position: absolute;
      bottom: 28px;
      left: 28px;
      z-index: 10;
      background: rgba(13, 17, 23, 0.94);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 24px;
      width: 400px; /* Tarjeta más ancha */
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
    }

    .card-status {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #ffaa00;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 20px; /* Título bien grande */
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .card-subtitle {
      font-size: 15px;
      color: #dddddd;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-distance {
      font-size: 14px;
      color: #aaaaaa;
      margin-bottom: 18px;
    }

    .controls-row {
      display: flex;
      gap: 12px;
    }

    .btn-action {
      flex: 1;
      background: #ffaa00;
      border: none;
      border-radius: 25px;
      padding: 12px;
      color: #000;
      font-size: 15px; /* Botón bien legible */
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-action:hover {
      background: #ffc44d;
      transform: translateY(-2px);
    }

    .btn-sec {
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .btn-sec:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .btn-sec.active {
      background: rgba(255, 0, 85, 0.25);
      border-color: #ff0055;
      color: #ff0055;
    }

    /* ECUALIZADOR ANIMADO */
    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
    }

    .eq-bar {
      width: 3px;
      background: #ffaa00;
      animation: bounce 0.8s infinite alternate ease-in-out;
    }

    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0% { height: 4px; }
      100% { height: 16px; }
    }

    /* BRANDING INFERIOR DERECHO */
    .brand-card {
      position: absolute;
      bottom: 28px;
      right: 28px;
      z-index: 10;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 14px 20px;
      text-align: right;
    }

    .brand-title {
      font-size: 16px; /* Texto destacado */
      font-weight: 800;
      color: #ffaa00;
      letter-spacing: 0.5px;
    }

    .brand-sub {
      font-size: 12px;
      color: #bbb;
      letter-spacing: 1px;
      margin-top: 3px;
    }

    /* BARRA DE DESPLAZAMIENTO (SCROLLBAR) */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,170,0,0.5);
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <!-- CONTENEDOR DE PLANETA 3D -->
  <div id="globe-container"></div>

  <!-- BARRA SUPERIOR DE BÚSQUEDA Y FILTROS -->
  <div class="top-bar">
    <div class="top-controls-left">
      <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar emisora o país..." autocomplete="off">
        <div id="searchResults" class="search-results"></div>
      </div>

      <select id="genreSelect" class="select-top">
        <option value="ALL">🎵 Todos los géneros</option>
        <option value="Tango">Tango</option>
        <option value="Ballads">Baladas / Lentos</option>
        <option value="Classic">Clásica</option>
        <option value="Rock">Rock / Pop</option>
      </select>

      <button id="hqBtn" class="btn-top">HQ</button>
      <button id="themeBtn" class="btn-top">☀️</button>
    </div>

    <!-- PANEL DE FAVORITOS (ARRIBA DERECHA) -->
    <div class="fav-panel">
      <div class="fav-title">
        <span>★ MIS FAVORITAS</span>
        <span id="favCount" style="font-size:12px; color:#aaa;">(0)</span>
      </div>
      <div class="fav-list" id="favList">
        <!-- Generado dinámicamente -->
      </div>
    </div>
  </div>

  <!-- TARJETA DEL REPRODUCTOR (ABAJO IZQUIERDA) -->
  <div class="player-card">
    <div class="card-status">
      <span>• SINTONIZANDO</span>
      <div class="eq-bars" id="eqBars">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>
    </div>

    <div class="card-title" id="radioTitle">Seleccioná una radio</div>
    <div class="card-subtitle" id="radioCountry">📍 Haz clic en un punto dorado del mapa</div>
    <div class="card-distance" id="radioDistance">📐 Distancia: -</div>

    <div class="controls-row">
      <button class="btn-action" id="playBtn">▶ Pausa</button>
      <button class="btn-action btn-sec" id="surpriseBtn">🎲 Sorpréndeme</button>
      <button class="btn-action btn-sec" id="favToggleBtn">♥ Guardar</button>
    </div>
  </div>

  <!-- MARCA Y UBICACIÓN DE BARILOCHE (ABAJO DERECHA) -->
  <div class="brand-card">
    <div class="brand-title">RADIO S.C.BARILOCHE</div>
    <div class="brand-sub">PATAGONIA ARGENTINA • GLOBAL EXPLORER</div>
  </div>

  <!-- REPRODUCTOR AUDIO OCULTO -->
  <audio id="audioPlayer" preload="none"></audio>

  <script>
    // LISTA DE EMISORAS DE EJEMPLO (Con coordenadas reales)
    const stations = [
      {
        id: '1',
        name: 'LaRadioDeLosLentos - Just Ballads',
        country: 'Argentina',
        city: 'Buenos Aires',
        lat: -34.6037,
        lng: -58.3816,
        genre: 'Ballads',
        url: 'https://stream.zeno.fm/f3wvbb1v08quv'
      },
      {
        id: '2',
        name: 'Tango Berlin',
        country: 'Alemania',
        city: 'Berlín',
        lat: 52.5200,
        lng: 13.4050,
        genre: 'Tango',
        url: 'https://stream.zeno.fm/07r13tw238quv'
      },
      {
        id: '3',
        name: 'Sveriges Radio P2 FLAC',
        country: 'Suecia',
        city: 'Estocolmo',
        lat: 59.3293,
        lng: 18.0686,
        genre: 'Classic',
        url: 'https://http-live.sr.se/p2music-mp3-192'
      },
      {
        id: '4',
        name: 'Radio Nacional Bariloche',
        country: 'Argentina',
        city: 'San Carlos de Bariloche',
        lat: -41.1335,
        lng: -71.3103,
        genre: 'Rock',
        url: 'https://cdn.instream.audio/8000/stream'
      },
      {
        id: '5',
        name: 'Radio Swiss Classic',
        country: 'Suiza',
        city: 'Berna',
        lat: 46.9480,
        lng: 7.4474,
        genre: 'Classic',
        url: 'https://stream.srg-ssr.ch/m/rsc_de/mp3_128'
      }
    ];

    // COORDENADAS DE BARILOCHE
    const BARILOCHE_LAT = -41.1335;
    const BARILOCHE_LNG = -71.3103;

    // ESTADO DE LA APLICACIÓN
    let currentStation = null;
    let isPlaying = false;
    let favorites = ['1', '2', '3']; // IDs por defecto para mostrar

    // ELEMENTOS DEL DOM
    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const surpriseBtn = document.getElementById('surpriseBtn');
    const favToggleBtn = document.getElementById('favToggleBtn');
    const radioTitle = document.getElementById('radioTitle');
    const radioCountry = document.getElementById('radioCountry');
    const radioDistance = document.getElementById('radioDistance');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const genreSelect = document.getElementById('genreSelect');
    const favList = document.getElementById('favList');
    const favCount = document.getElementById('favCount');
    const eqBars = document.getElementById('eqBars');

    // FÓRMULA DE DISTANCIA (HAVERSINE)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Radio de la Tierra en Km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    // INICIALIZACIÓN DEL GLOBO 3D
    const world = Globe()
      (document.getElementById('globe-container'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .pointsData(stations)
      .pointLat('lat')
      .pointLng('lng')
      .pointColor(() => '#ffaa00')
      .pointAltitude(0.04)
      .pointRadius(0.6)
      .pointResolution(32)
      .onPointClick(station => tuneStation(station));

    // Ajustar punto de vista inicial hacia Argentina / Sudamérica
    world.pointOfView({ lat: -38, lng: -63, altitude: 2.2 }, 1000);

    // REPRODUCIR EMISORA
    function tuneStation(station) {
      currentStation = station;
      radioTitle.textContent = station.name;
      radioCountry.textContent = `📍 ${station.city}, ${station.country}`;
      
      const dist = calculateDistance(BARILOCHE_LAT, BARILOCHE_LNG, station.lat, station.lng);
      radioDistance.textContent = `📐 A ${dist.toLocaleString()} km de tu ubicación`;

      // Cargar stream
      audioPlayer.src = station.url;
      audioPlayer.play().then(() => {
        isPlaying = true;
        updatePlayButton();
      }).catch(e => {
        console.log("Error de reproducción:", e);
        isPlaying = false;
        updatePlayButton();
      });

      // Mover cámara suavemente hacia la radio seleccionada
      world.pointOfView({ lat: station.lat, lng: station.lng, altitude: 1.8 }, 1500);

      updateFavButtonState();
    }

    // BOTÓN PLAY / PAUSA
    playBtn.addEventListener('click', () => {
      if (!currentStation) {
        tuneStation(stations[0]);
        return;
      }

      if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
      } else {
        audioPlayer.play();
        isPlaying = true;
      }
      updatePlayButton();
    });

    function updatePlayButton() {
      if (isPlaying) {
        playBtn.textContent = '⏸ Pausa';
        eqBars.style.display = 'inline-flex';
      } else {
        playBtn.textContent = '▶ Reproducir';
        eqBars.style.display = 'none';
      }
    }

    // BOTÓN SORPRÉNDEME (RADIO ALEATORIA)
    surpriseBtn.addEventListener('click', () => {
      const randomIndex = Math.floor(Math.random() * stations.length);
      tuneStation(stations[randomIndex]);
    });

    // SISTEMA DE FAVORITOS
    function renderFavorites() {
      favList.innerHTML = '';
      favCount.textContent = `(${favorites.length})`;

      favorites.forEach(id => {
        const st = stations.find(s => s.id === id);
        if (!st) return;

        const item = document.createElement('div');
        item.className = 'fav-item';
        item.innerHTML = `
          <span>📻 ${st.name}</span>
          <span class="fav-remove" title="Quitar">✕</span>
        `;

        item.querySelector('span').addEventListener('click', () => tuneStation(st));
        item.querySelector('.fav-remove').addEventListener('click', (e) => {
          e.stopPropagation();
          removeFavorite(st.id);
        });

        favList.appendChild(item);
      });
    }

    function removeFavorite(id) {
      favorites = favorites.filter(fId => fId !== id);
      renderFavorites();
      updateFavButtonState();
    }

    favToggleBtn.addEventListener('click', () => {
      if (!currentStation) return;

      if (favorites.includes(currentStation.id)) {
        removeFavorite(currentStation.id);
      } else {
        favorites.push(currentStation.id);
        renderFavorites();
        updateFavButtonState();
      }
    });

    function updateFavButtonState() {
      if (currentStation && favorites.includes(currentStation.id)) {
        favToggleBtn.classList.add('active');
        favToggleBtn.textContent = '♥ Guardado';
      } else {
        favToggleBtn.classList.remove('active');
        favToggleBtn.textContent = '♡ Guardar';
      }
    }

    // BUSCADOR EN TIEMPO REAL
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (!query) {
        searchResults.style.display = 'none';
        return;
      }

      const filtered = stations.filter(s => 
        s.name.toLowerCase().includes(query) || 
        s.country.toLowerCase().includes(query) ||
        s.city.toLowerCase().includes(query)
      );

      searchResults.innerHTML = '';
      if (filtered.length === 0) {
        searchResults.style.display = 'none';
        return;
      }

      filtered.forEach(s => {
        const div = document.createElement('div');
        div.className = 'results-item';
        div.textContent = `${s.name} (${s.country})`;
        div.addEventListener('click', () => {
          tuneStation(s);
          searchResults.style.display = 'none';
          searchInput.value = '';
        });
        searchResults.appendChild(div);
      });

      searchResults.style.display = 'block';
    });

    // CERRAR BUSCADOR AL HACER CLIC AFUERA
    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';
      }
    });

    // FILTRO POR GÉNERO
    genreSelect.addEventListener('change', (e) => {
      const selectedGenre = e.target.value;
      if (selectedGenre === 'ALL') {
        world.pointsData(stations);
      } else {
        const filtered = stations.filter(s => s.genre === selectedGenre);
        world.pointsData(filtered);
      }
    });

    // AJUSTE AUTOMÁTICO DE PANTALLA
    window.addEventListener('resize', () => {
      world.width(window.innerWidth).height(window.innerHeight);
    });

    // INICIALIZACIÓN AL CORTAR
    renderFavorites();
    // Iniciar con la primera radio por defecto (La Radio de Los Lentos)
    tuneStation(stations[0]);
  </script>
</body>
</html>
