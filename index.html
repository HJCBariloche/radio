<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio S.C. Bariloche - Global Explorer</title>

  <!-- Fuente Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Librería Globe.gl -->
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #04060a;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
    }

    #globe {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* BARRA SUPERIOR */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .top-controls-left {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .search-container {
      position: relative;
      width: 260px;
    }

    .search-input {
      width: 100%;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 8px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: #ffaa00;
      box-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
    }

    .search-results {
      position: absolute;
      top: 110%;
      left: 0;
      right: 0;
      background: rgba(13, 17, 23, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      z-index: 20;
    }

    .results-item {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .results-item:hover {
      background: rgba(255, 170, 0, 0.2);
    }

    .btn-top, .select-top {
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 8px 14px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-top:hover, .select-top:hover {
      border-color: #ffaa00;
      color: #ffaa00;
    }

    .btn-top.active {
      background: #ffaa00;
      color: #000;
      font-weight: 600;
    }

    /* PANEL FAVORITOS */
    .fav-panel {
      pointer-events: auto;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 14px;
      min-width: 200px;
      max-width: 260px;
    }

    .fav-title {
      font-size: 12px;
      font-weight: 700;
      color: #ffaa00;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fav-list {
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .fav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      padding: 3px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* TARJETA INFERIOR IZQUIERDA */
    .player-card {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(13, 17, 23, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 16px 20px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .card-status {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffaa00;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .card-subtitle {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }

    .card-distance {
      font-size: 11px;
      color: #888;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 170, 0, 0.15);
      color: #ffaa00;
      border: 1px solid rgba(255, 170, 0, 0.3);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 600;
    }

    .controls-row {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      flex: 1;
      background: #ffaa00;
      border: none;
      border-radius: 20px;
      padding: 8px;
      color: #000;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: #ffc44d;
      transform: translateY(-1px);
    }

    .btn-sec {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn-sec:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-sec.active {
      background: rgba(255, 0, 85, 0.2);
      border-color: #ff0055;
      color: #ff0055;
    }

    /* ECUALIZADOR ANIMADO */
    .eq-bars {
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .eq-bar {
      width: 2px;
      background: #ffaa00;
      animation: bounce 0.8s infinite alternate ease-in-out;
    }

    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0% { height: 2px; }
      100% { height: 12px; }
    }

    /* BRANDING INFERIOR DERECHO */
    .brand-card {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 16px;
      text-align: right;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 800;
      color: #ffaa00;
      letter-spacing: 0.5px;
    }

    .brand-sub {
      font-size: 9px;
      color: #777;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div id="globe"></div>

  <!-- BARRA SUPERIOR -->
  <div class="top-bar">
    <div class="top-controls-left">
      <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar emisora o país..." onkeydown="handleSearchKey(event)">
        <div id="searchResults" class="search-results"></div>
      </div>

      <select class="select-top" onchange="filterByGenre(this.value)">
        <option value="all">🎵 Todos los géneros</option>
        <option value="pop">Pop</option>
        <option value="rock">Rock</option>
        <option value="news">Noticias</option>
        <option value="tango">Tango</option>
        <option value="lentos">Lentos / Baladas</option>
        <option value="electronic">Electrónica</option>
      </select>

      <button id="hdBtn" class="btn-top" onclick="toggleHD()">HQ</button>
      <button id="themeBtn" class="btn-top" onclick="toggleTheme()" title="Modo Día/Noche">☀️</button>
      <button class="btn-top" onclick="locateOrigin()" title="Volver a mi posición">🏔️</button>
    </div>

    <!-- FAVORITOS -->
    <div class="fav-panel">
      <div class="fav-title">★ MIS FAVORITAS</div>
      <div id="favList" class="fav-list">
        <p style="font-size:11px; color:#666; margin:0;">Sin favoritos</p>
      </div>
    </div>
  </div>

  <!-- TARJETA CONTROLADOR -->
  <div class="player-card">
    <div class="card-status">
      <span id="statusText">● SINTONIZANDO</span>
      <div id="eqBars" class="eq-bars">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>
    </div>
    <div id="name" class="card-title">Cargando...</div>
    <div id="country" class="card-subtitle">📍 -</div>
    <div id="distance" class="card-distance">📐 -</div>
    <div style="margin-bottom: 12px;">
      <span id="bitrateBadge" class="badge" style="display:none;"></span>
    </div>

    <div class="controls-row">
      <button id="playBtn" class="btn-action" onclick="toggleAudio()">▶ Reprod.</button>
      <button class="btn-action btn-sec" onclick="playRandomStation()">🎲 Sorpréndeme</button>
      <button id="favBtn" class="btn-action btn-sec" onclick="toggleFavorite()">♡ Guardar</button>
    </div>
  </div>

  <!-- BRANDING -->
  <div class="brand-card">
    <div class="brand-title">RADIO S.C.BARILOCHE</div>
    <div class="brand-sub">PATAGONIA ARGENTINA • GLOBAL EXPLORER</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
