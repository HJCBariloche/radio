<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Radio Garden</title>
  <script src="//unpkg.com/globe.gl"></script>
  <style>
    body { margin: 0; background-color: #030303; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
    .crosshair {
      position: absolute; top: 50%; left: 50%; width: 36px; height: 36px;
      transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,0.85);
      border-radius: 50%; pointer-events: none; z-index: 10;
      box-shadow: 0 0 15px rgba(29, 185, 84, 0.9);
    }
    .crosshair::after {
      content: ''; position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
      background-color: #1db954; border-radius: 50%; transform: translate(-50%, -50%);
    }
    .search-container {
      position: absolute; top: 20px; left: 20px; z-index: 20;
      width: calc(100% - 280px); max-width: 380px; display: flex; gap: 8px;
    }
    .search-input {
      flex: 1; padding: 12px 18px; border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(15,15,15,0.85);
      backdrop-filter: blur(10px); color: #fff; font-size: 14px; outline: none; box-sizing: border-box;
    }
    .geo-btn {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(15,15,15,0.85); backdrop-filter: blur(10px); color: #fff;
      font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .fav-panel {
      position: absolute; top: 20px; right: 20px; background: rgba(15,15,15,0.85);
      backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 12px 16px; z-index: 20; width: 200px; max-height: 250px; overflow-y: auto;
    }
    .fav-panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #1db954; }
    .fav-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
    .card {
      position: absolute; bottom: 24px; left: 24px; background: rgba(15,15,15,0.85);
      backdrop-filter: blur(8px); padding: 16px 20px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1); z-index: 10; min-width: 240px;
    }
    .card h2 { margin: 0 0 4px 0; font-size: 18px; }
    .card p { margin: 0; font-size: 13px; color: #8e8e93; }
    .btn { margin-top: 10px; background: #1db954; border: none; color: #000; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .fav-btn { background: transparent; border: 1px solid #1db954; color: #1db954; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; margin-left: 8px; }
    .fav-btn.active { background: #1db954; color: #000; }
  </style>
</head>
<body>
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar radio por nombre..." oninput="searchStationName()" autocomplete="off">
    <button class="geo-btn" onclick="locateUser()" title="Ir a mi ubicación">🎯</button>
  </div>
  <div class="fav-panel">
    <h3>⭐ Favoritos</h3>
    <div id="favList"></div>
  </div>
  <div class="crosshair"></div>
  <div class="card">
    <p>🟢 SINTONIZANDO</p>
    <h2 id="name">Cargando emisoras...</h2>
    <p id="country">Buscando emisora cercana</p>
    <div>
      <button class="btn" id="playBtn" onclick="toggleAudio()">▶ Reprod.</button>
      <button class="fav-btn" id="favBtn" onclick="toggleFavorite()">♡ Guardar</button>
    </div>
  </div>
  <div id="globe"></div>
  <script>
    let stations = [], currentStation = null, audio = new Audio(), timer = null;
    let favorites = JSON.parse(localStorage.getItem('myRadioFavorites')) || [];

    function dist(lat1, lon1, lat2, lon2) {
      const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Configuración del Globo 3D estilo Radio Garden
    const world = Globe()(document.getElementById('globe'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .pointColor(() => '#1db954')
      .pointAltitude(0.005)
      .pointRadius(0.25)
      .polygonCapColor(() => 'rgba(0,0,0,0)')
      .polygonSideColor(() => 'rgba(0,0,0,0)')
      .polygonStrokeColor(() => 'rgba(255, 255, 255, 0.25)'); // Líneas de fronteras de países

    // Cargar mapa de países (líneas de división)
    fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
      .then(res => res.json())
      .then(countries => {
        world.polygonsData(countries.features);
      });

    // Zoom más grande e inicial enfocado en Sudamérica
    world.pointOfView({ lat: -38.4, lng: -63.6, altitude: 1.4 });

    // Carga de 8.000 radios
    fetch('https://de1.api.radio-browser.info/json/stations/search?limit=8000&has_geo_info=true&order=votes&reverse=true')
      .then(r => r.json())
      .then(data => {
        stations = data.map(s => ({ name: s.name.trim(), country: s.country, lat: +s.geo_lat, lng: +s.geo_long, url: s.url_resolved }))
                       .filter(s => !isNaN(s.lat) && !isNaN(s.lng) && s.lat !== 0 && s.lng !== 0);
        world.pointsData(stations);
        tuneNearestStation();
        updateFavoritesUI();
      });

    function tuneNearestStation() {
      if (!stations.length) return;
      const center = world.pointOfView();
      let nearest = null, min = Infinity;
      for (const s of stations) {
        const d = dist(center.lat, center.lng, s.lat, s.lng);
        if (d < min) { min = d; nearest = s; }
      }
      if (nearest && min < 1000 && nearest !== currentStation) {
        currentStation = nearest;
        document.getElementById('name').innerText = nearest.name;
        document.getElementById('country').innerText = `📍 ${nearest.country} (${Math.round(min)} km)`;
        audio.src = nearest.url;
        audio.play().then(() => document.getElementById('playBtn').innerText = '⏸ Pausa')
             .catch(() => document.getElementById('playBtn').innerText = '▶ Reprod.');
        updateFavoritesUI();
      }
    }

    function toggleAudio() {
      if (audio.paused) { audio.play(); document.getElementById('playBtn').innerText = '⏸ Pausa'; }
      else { audio.pause(); document.getElementById('playBtn').innerText = '▶ Reprod.'; }
    }

    function flyTo(lat, lng) {
      world.pointOfView({ lat, lng, altitude: 1.2 }, 2000);
      setTimeout(tuneNearestStation, 2100);
    }

    function locateUser() {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(pos => flyTo(pos.coords.latitude, pos.coords.longitude));
      }
    }

    function searchStationName() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (q.length < 3) return;
      const found = stations.find(s => s.name.toLowerCase().includes(q) || s.country.toLowerCase().includes(q));
      if (found) { flyTo(found.lat, found.lng); }
    }

    function toggleFavorite() {
      if (!currentStation) return;
      const index = favorites.findIndex(f => f.url === currentStation.url);
      if (index >= 0) { favorites.splice(index, 1); }
      else { favorites.push({ name: currentStation.name, country: currentStation.country, lat: currentStation.lat, lng: currentStation.lng, url: currentStation.url }); }
      localStorage.setItem('myRadioFavorites', JSON.stringify(favorites));
      updateFavoritesUI();
    }

    function updateFavoritesUI() {
      const favBtn = document.getElementById('favBtn');
      const favList = document.getElementById('favList');
      if (currentStation) {
        const isFav = favorites.some(f => f.url === currentStation.url);
        favBtn.classList.toggle('active', isFav);
        favBtn.innerText = isFav ? '♥ Guardado' : '♡ Guardar';
      }
      favList.innerHTML = favorites.length === 0 ? '<p style="font-size:11px; color:#666; margin:0;">Sin favoritos aún</p>' : '';
      favorites.forEach((fav) => {
        const div = document.createElement('div');
        div.className = 'fav-item';
        div.innerHTML = `<span onclick="flyTo(${fav.lat}, ${fav.lng})" style="cursor:pointer">📻 ${fav.name}</span>`;
        favList.appendChild(div);
      });
    }

    world.controls().addEventListener('change', () => {
      clearTimeout(timer);
      timer = setTimeout(tuneNearestStation, 150);
    });
  </script>
</body>
</html>
