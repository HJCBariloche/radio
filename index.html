<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RADIO S.C.BARILOCHE - Global Radio Explorer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #02040a;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #ffffff;
    }

    #globe {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 26px;
      height: 26px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 170, 0, 0.85);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 0 14px rgba(255, 170, 0, 0.7);
    }
    .crosshair::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background-color: #ffaa00;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .search-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 680px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-input {
      width: 260px;
      padding: 10px 18px;
      border-radius: 24px;
      border: 1.5px solid rgba(255, 170, 0, 0.5);
      background: rgba(12, 16, 28, 0.95);
      backdrop-filter: blur(12px);
      color: #fff;
      font-size: 14px;
      outline: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: #ffaa00;
      box-shadow: 0 0 14px rgba(255, 170, 0, 0.5);
    }
    .search-input::placeholder { color: #8a99ad; }

    .genre-select {
      padding: 10px 18px;
      border-radius: 24px;
      border: 1.5px solid rgba(255, 170, 0, 0.5);
      background: rgba(12, 16, 28, 0.95);
      backdrop-filter: blur(12px);
      color: #ffaa00;
      font-size: 14px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
    }
    .genre-select option {
      background-color: #0c101c;
      color: #fff;
      font-size: 14px;
    }

    .btn-top {
      height: 42px;
      padding: 0 16px;
      border-radius: 21px;
      border: 1.5px solid rgba(255, 170, 0, 0.5);
      background: rgba(12, 16, 28, 0.95);
      backdrop-filter: blur(12px);
      color: #ffaa00;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-top:hover {
      border-color: #ffaa00;
      transform: scale(1.05);
    }
    .btn-top.active {
      background: #ffaa00;
      color: #02040a;
    }

    .geo-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 170, 0, 0.5);
      background: rgba(12, 16, 28, 0.95);
      backdrop-filter: blur(12px);
      color: #ffaa00;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transition: transform 0.2s ease;
    }
    .geo-btn:hover {
      transform: scale(1.08);
      border-color: #ffaa00;
    }

    .fav-toggle-btn {
      display: none;
    }

    .results-dropdown {
      background: rgba(12, 16, 28, 0.96);
      border: 1.5px solid rgba(255, 170, 0, 0.5);
      border-radius: 16px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    }
    .results-item {
      padding: 10px 16px;
      font-size: 14px;
      color: #ddd;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .results-item:hover {
      background: rgba(255, 170, 0, 0.25);
      color: #ffaa00;
    }

    .fav-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(12, 16, 28, 0.95);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 170, 0, 0.5);
      border-radius: 16px;
      padding: 14px 18px;
      z-index: 30;
      width: 260px;
      max-height: 240px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      transition: all 0.3s ease;
    }
    .fav-panel h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #ffaa00;
      letter-spacing: 0.5px;
      font-weight: 700;
    }
    .fav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
      color: #dddddd;
    }
    .fav-item span:hover { color: #ffaa00; }

    .card {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(12, 16, 28, 0.95);
      backdrop-filter: blur(12px);
      padding: 18px 22px;
      border-radius: 18px;
      border: 1.5px solid rgba(255, 170, 0, 0.5);
      z-index: 30;
      width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .status-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #ffaa00;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .card h2 {
      margin: 0 0 4px 0;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card p {
      margin: 3px 0;
      font-size: 14px;
      color: #abb8c7;
    }
    .distance-tag {
      font-size: 13px;
      color: #ffaa00;
      font-weight: 700;
      margin-top: 4px;
      display: block;
    }
    .bitrate-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: #ffaa00;
      background: rgba(255, 170, 0, 0.15);
      border: 1px solid rgba(255, 170, 0, 0.4);
      border-radius: 8px;
      padding: 2px 8px;
      margin-top: 6px;
    }
    .hint-tag {
      font-size: 11px;
      color: #667788;
      margin-top: 4px;
      display: block;
      font-style: italic;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-play {
      flex: 1;
      background: #ffaa00;
      border: none;
      color: #02040a;
      padding: 8px 12px;
      height: 36px;
      border-radius: 18px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-play:hover {
      background: #ffc44d;
      transform: scale(1.02);
    }
    .btn-random {
      background: rgba(255, 170, 0, 0.15);
      border: 1.5px solid rgba(255, 170, 0, 0.6);
      color: #ffaa00;
      padding: 8px 12px;
      height: 36px;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-random:hover {
      background: rgba(255, 170, 0, 0.3);
      transform: scale(1.02);
    }
    .btn-fav {
      background: transparent;
      border: 1.5px solid rgba(255, 170, 0, 0.6);
      color: #ffaa00;
      padding: 8px 12px;
      height: 36px;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-fav.active {
      background: #ffaa00;
      color: #02040a;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .volume-btn {
      background: transparent;
      border: none;
      color: #ffaa00;
      font-size: 16px;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
    }
    .volume-btn:hover {
      transform: scale(1.15);
    }

    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ffaa00;
      box-shadow: 0 0 8px rgba(255, 170, 0, 0.8);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    .volume-slider::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ffaa00;
      border: none;
      box-shadow: 0 0 8px rgba(255, 170, 0, 0.8);
      cursor: pointer;
    }

    .volume-value {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      color: #8a99ad;
      min-width: 38px;
      text-align: right;
      font-weight: 600;
    }

    .eq-bars {
      display: none;
      align-items: flex-end;
      gap: 3px;
      height: 14px;
    }
    .eq-bar {
      width: 3px;
      background: #ffaa00;
      animation: eqAnim 0.8s infinite alternate ease-in-out;
    }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    @keyframes eqAnim {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    .clock-box {
      position: absolute;
      bottom: 105px;
      right: 24px;
      z-index: 30;
      background: rgba(10, 14, 24, 0.94);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 170, 0, 0.6);
      border-radius: 20px;
      padding: 12px 20px;
      text-align: center;
      min-width: 260px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      font-family: 'Orbitron', monospace;
    }
    .clock-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .clock-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .clock-label-station { color: #ffaa00; }
    .clock-label-local { color: #8a99ad; margin-top: 8px; }

    .clock-time-station {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
      letter-spacing: 2px;
      line-height: 1.1;
    }
    .clock-time-local {
      font-size: 20px;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 2px;
      line-height: 1.1;
    }

    .branding-box {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 30;
      background: rgba(12, 16, 28, 0.95);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 170, 0, 0.6);
      border-radius: 16px;
      padding: 14px 26px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 260px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .branding-title {
      font-size: 19px;
      font-weight: 800;
      color: #ffaa00;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 0;
      text-shadow: 0 0 14px rgba(255, 170, 0, 0.7);
      text-align: center;
      width: 100%;
      display: block;
    }
    .branding-sub {
      font-size: 11px;
      color: #8a99ad;
      margin: 4px 0 0 0;
      letter-spacing: 1px;
      font-weight: 600;
      text-align: center;
      width: 100%;
      display: block;
    }

    @media (min-width: 768px) and (max-width: 1024px) {
      .search-container { top: 16px; left: 16px; max-width: 520px; }
      .search-input { width: 200px; }
      .fav-panel { top: 16px; right: 16px; width: 230px; }
      .card { bottom: 16px; left: 16px; width: 320px; padding: 16px 20px; }
      .clock-box { bottom: 95px; right: 16px; min-width: 220px; padding: 10px 16px; }
      .branding-box { bottom: 16px; right: 16px; min-width: 220px; padding: 10px 18px; }
      .branding-title { font-size: 16px; }
    }

    @media (max-width: 767px) {
      .crosshair { display: none; }
      .search-container { top: 12px; left: 12px; right: 12px; max-width: none; width: calc(100% - 24px); }
      .search-row { flex-wrap: wrap; gap: 8px; }
      .search-input { width: 100%; flex: 1 1 100%; order: 1; }
      .genre-select { flex: 1 1 auto; font-size: 13px; padding: 8px 12px; order: 2; }
      .btn-top, .geo-btn { height: 38px; padding: 0 12px; font-size: 13px; order: 3; }
      .fav-toggle-btn { display: flex !important; order: 4; }

      .fav-panel { top: 115px; right: 12px; left: 12px; width: auto; max-height: 45vh; display: none; box-shadow: 0 12px 32px rgba(0,0,0,0.9); }
      .fav-panel.show { display: block !important; }

      .card { bottom: 12px; left: 12px; right: 12px; width: calc(100% - 24px); padding: 14px 18px; border-radius: 16px; }
      .card h2 { font-size: 16px; }
      .controls { gap: 8px; }
      .btn-play, .btn-random, .btn-fav { padding: 8px 6px; font-size: 12px; height: 38px; }

      .clock-box { bottom: auto; top: 115px; right: 12px; min-width: 160px; padding: 8px 12px; border-radius: 14px; background: rgba(10, 14, 24, 0.88); }
      .clock-time-station { font-size: 17px; }
      .clock-time-local { font-size: 15px; }
      .clock-label { font-size: 8px; }
      .branding-box { display: none; }
    }
  </style>
</head>
<body>

  <div class="search-container">
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar emisora o país..." onkeydown="handleSearchKey(event)" autocomplete="off">
      
      <select id="genreSelect" class="genre-select" onchange="filterByGenre(this.value)">
        <option value="all">🎵 Todos los géneros</option>
        <option value="lentos">💕 Lentos / Baladas</option>
        <option value="folklore">🪗 Folklore</option>
        <option value="rock">🎸 Rock</option>
        <option value="pop">🎤 Pop</option>
        <option value="80s">📻 Años 80s / Retro</option>
        <option value="jazz">🎷 Jazz</option>
        <option value="tango">💃 Tango</option>
        <option value="cumbia">🪘 Cumbia / Tropical</option>
        <option value="reggae">🌴 Reggae / Chill</option>
        <option value="news">📰 Noticias</option>
        <option value="electronic">🎧 Electrónica</option>
        <option value="classical">🎻 Clásica</option>
      </select>

      <button id="hdBtn" class="btn-top" onclick="toggleHD()" title="Solo Alta Calidad HQ">HQ</button>
      <button id="themeBtn" class="btn-top" onclick="toggleTheme()" title="Modo Día / Noche">☀️</button>
      <button class="geo-btn" onclick="locateOrigin()" title="Ir a mi ubicación">🏔️</button>
      <button id="favToggleBtn" class="btn-top fav-toggle-btn" onclick="toggleFavPanelMobile()" title="Mis Favoritas">⭐</button>
    </div>
    <div id="searchResults" class="results-dropdown"></div>
  </div>

  <div class="fav-panel" id="favPanel">
    <h3>⭐ MIS FAVORITAS</h3>
    <div id="favList"></div>
  </div>

  <div class="crosshair"></div>

  <div class="card">
    <div class="status-badge">
      <span id="statusText">● SINTONIZANDO</span>
      <div class="eq-bars" id="eqBars">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>
    </div>
    <h2 id="name">Buscando emisoras...</h2>
    <p id="country">📍 -</p>
    <span id="distance" class="distance-tag"></span>
    <span id="bitrateBadge" class="bitrate-badge" style="display:none;"></span>
    <span class="hint-tag">💡 Mové el globo y hacé clic para cambiar de radio</span>
    
    <div class="controls">
      <button class="btn-play" id="playBtn" onclick="toggleAudio()">▶ Reprod.</button>
      <button class="btn-random" onclick="playRandomStation()" title="Radio Aleatoria">🎲 Sorpréndeme</button>
      <button class="btn-fav" id="favBtn" onclick="toggleFavorite()">♡ Guardar</button>
    </div>

    <div class="volume-container">
      <button id="muteBtn" class="volume-btn" onclick="toggleMute()" title="Silenciar / Activar sonido">🔊</button>
      <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
      <span id="volumeValue" class="volume-value">100%</span>
    </div>
  </div>

  <div class="clock-box" id="clockBox">
    <div class="clock-row">
      <div id="clockStationLabel" class="clock-label clock-label-station">HORA DE LA RADIO</div>
      <div id="clockStation" class="clock-time-station">--:--</div>
    </div>
    <div class="clock-row">
      <div class="clock-label clock-label-local">HORA LOCAL</div>
      <div id="clockLocal" class="clock-time-local">--:--</div>
    </div>
  </div>

  <div class="branding-box">
    <h1 class="branding-title">RADIO S.C.BARILOCHE</h1>
    <p class="branding-sub">PATAGONIA ARGENTINA • GLOBAL EXPLORER</p>
  </div>

  <div id="globe"></div>

  <script src="app.js"></script>
</body>
</html>
