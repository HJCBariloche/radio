<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Radio Explorer - Bariloche Edition</title>
  <script src="//unpkg.com/globe.gl"></script>
  <style>
    body { margin: 0; background-color: #02040a; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    
    /* Mirilla central fija */
    .crosshair {
      position: absolute; top: 50%; left: 50%; width: 26px; height: 26px;
      transform: translate(-50%, -50%); border: 1.5px solid rgba(0, 240, 255, 0.9);
      border-radius: 50%; pointer-events: none; z-index: 10;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.7);
    }
    .crosshair::after {
      content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
      background-color: #00f0ff; border-radius: 50%; transform: translate(-50%, -50%);
    }

    /* Contenedor del Buscador y Filtros superior */
    .search-container {
      position: absolute; top: 20px; left: 20px; z-index: 20;
      display: flex; flex-direction: column; gap: 8px; max-width: 500px; width: calc(100% - 280px);
    }
    .search-row { display: flex; gap: 8px; width: 100%; align-items: center; }
    .search-input {
      flex: 1; padding: 10px 16px; border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.5); background: rgba(8, 12, 22, 0.92);
      backdrop-filter: blur(12px); color: #fff; font-size: 13px; outline: none;
    }
    .search-input::placeholder { color: #8a99ad; }
    
    .genre-select {
      padding: 9px 12px; border-radius: 18px;
      border: 1px solid rgba(0, 240, 255, 0.5); background: rgba(8, 12, 22, 0.92);
      backdrop-filter: blur(12px); color: #00f0ff; font-size: 12px; outline: none; cursor: pointer; font-weight: 600;
    }

    .geo-btn {
      width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(0, 240, 255, 0.5);
      background: rgba(8, 12, 22, 0.92); backdrop-filter: blur(12px); color: #00f0ff;
      font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    /* Sugerencias de búsqueda */
    .results-dropdown {
      background: rgba(8, 12, 22, 0.95); border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 12px; max-height: 180px; overflow-y: auto; display: none;
      backdrop-filter: blur(12px);
    }
    .results-item {
      padding: 8px 12px; font-size: 12px; color: #ccc; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .results-item:hover { background: rgba(0, 240, 255, 0.2); color: #00f0ff; }

    /* Panel de Favoritos */
    .fav-panel {
      position: absolute; top: 20px; right: 20px; background: rgba(8, 12, 22, 0.92);
      backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 12px; padding: 12px 16px; z-index: 20; width: 210px; max-height: 240px; overflow-y: auto;
    }
    .fav-panel h3 { margin: 0 0 8px 0; font-size: 13px; color: #00f0ff; letter-spacing: 0.5px; }
    .fav-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; color: #ccc; }
    .fav-item:hover { color: #00f0ff; }

    /* Tarjeta de reproducción inferior */
    .card {
      position: absolute; bottom: 24px; left: 24px; background: rgba(8, 12, 22, 0.92);
      backdrop-filter: blur(12px); padding: 16px 20px; border-radius: 14px;
      border: 1px solid rgba(0, 240, 255, 0.4); z-index: 10; min-width: 310px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .status-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #00f0ff; font-weight: 600; letter-spacing: 1px; margin-bottom: 4px; }
    .card h2 { margin: 0 0 4px 0; font-size: 16px; font-weight: 600; }
    .card p { margin: 2px 0; font-size: 12px; color: #8a99ad; }
    .distance-tag { font-size: 11px; color: #00f0ff; font-weight: 600; margin-top: 6px; display: block; }
    .hint-tag { font-size: 10px; color: #667788; margin-top: 4px; display: block; font-style: italic; }
    
    .controls { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .btn { background: #00f0ff; border: none; color: #02040a; padding: 8px 14px; border-radius: 18px; font-weight: bold; cursor: pointer; font-size: 12px; transition: all 0.2s; }
    .btn:hover { background: #5cf2ff; transform: scale(1.02); }
    .random-btn { background: rgba(0, 240, 255, 0.15); border: 1px solid rgba(0, 240, 255, 0.5); color: #00f0ff; padding: 7px 12px; border-radius: 18px; cursor: pointer; font-weight: bold; font-size: 12px; transition: all 0.2s; }
    .random-btn:hover { background: rgba(0, 240, 255, 0.35); transform: scale(1.02); }
    .fav-btn { background: transparent; border: 1px solid rgba(0, 240, 255, 0.5); color: #00f0ff; padding: 7px 12px; border-radius: 18px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .fav-btn.active { background: #00f0ff; color: #02040a; }

    /* Animación ecualizador */
    .eq { display: flex; gap: 2px; height: 10px; align-items: flex-end; margin-left: auto; }
    .eq-bar { width: 2px; background: #00f0ff; animation: eqAnim 0.8s infinite alternate; }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    @keyframes eqAnim { 0% { height: 2px; } 100% { height: 10px; } }
  </style>
</head>
<body>
  <div class="search-container">
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar emisora o país (Enter)..." onkeydown="handleSearchKey(event)" autocomplete="off">
      <select id="genreSelect" class="genre-select" onchange="filterByGenre(this.value)">
        <option value="all">🎵 Todos</option>
        <option value="rock">🎸 Rock</option>
        <option value="jazz">🎷 Jazz</option>
        <option value="pop">🎤 Pop</option>
        <option value="news">📰 Noticias</option>
        <option value="electronic">🎧 Electrónica</option>
        <option value="classical">🎻 Clásica</option>
        <option value="tango">💃 Tango</option>
        <option value="sports">⚽ Deportes</option>
      </select>
      <button class="geo-btn" onclick="locateBariloche()" title="Ir a Bariloche">🏔️</button>
    </div>
    <div id="searchResults" class="results-dropdown"></div>
  </div>

  <div class="fav-panel">
    <h3>⭐ MIS FAVORITAS</h3>
    <div id="favList"></div>
  </div>

  <div class="crosshair"></div>

  <div class="card">
    <div class="status-badge">
      <span>● SINTONIZANDO</span>
      <div class="eq" id="eqBars" style="display:none;">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
    </div>
    <h2 id="name">Buscando emisoras...</h2>
    <p id="country">-</p>
    <span id="distance" class="distance-tag"></span>
    <span class="hint-tag">💡 Mové el globo y hacé doble clic para cambiar de radio</span>
    <div class="controls">
      <button class="btn" id="playBtn" onclick="toggleAudio()">▶ Reprod.</button>
      <button class="random-btn" onclick="playRandomStation()" title="Radio Aleatoria">🎲 Sorpréndeme</button>
      <button class="fav-btn" id="favBtn" onclick="toggleFavorite()">♡ Guardar</button>
    </div>
  </div>

  <div id="globe"></div>

  <script>
    let stations = [], currentStation = null, selectedGenre = 'all';
    const BARILOCHE = { lat: -41.1335, lng: -71.3103 };
    let audio = new Audio();
    let favorites = JSON.parse(localStorage.getItem('myRadioFavorites')) || [];

    function getKilometers(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    function isMatchGenre(station) {
      if (selectedGenre === 'all') return true;
      return station.tags.includes(selectedGenre) || station.name.toLowerCase().includes(selectedGenre);
    }

    // Configuración del Globo 3D con textura alternativa estable
    const world = Globe()(document.getElementById('globe'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .pointColor(s => isMatchGenre(s) ? '#00f0ff' : 'rgba(0, 240, 255, 0.08)')
      .pointAltitude(s => isMatchGenre(s) ? 0.003 : 0.001)
      .pointRadius(s => isMatchGenre(s) ? 0.06 : 0.02)
      .pointResolution(6)
      .polygonCapColor(() => 'rgba(0,0,0,0)')
      .polygonSideColor(() => 'rgba(0,0,0,0)')
      .polygonStrokeColor(() => 'rgba(0, 240, 255, 0.25)')
      .arcColor(() => ['#00f0ff', 'rgba(0, 240, 255, 0.1)'])
      .arcAltitude(0.28)
      .arcDashLength(0.4)
      .arcDashGap(0.2)
      .arcDashAnimateTime(1200)
      .arcStroke(1.2)
      .onPointClick((point) => tuneStation(point));

    fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
      .then(res => res.json())
      .then(countries => world.polygonsData(countries.features));

    world.pointOfView({ lat: BARILOCHE.lat, lng: BARILOCHE.lng, altitude: 0.9 });

    fetch('https://de1.api.radio-browser.info/json/stations/search?limit=8000&has_geo_info=true&order=votes&reverse=true')
      .then(r => r.json())
      .then(data => {
        stations = data.map(s => ({ 
          name: s.name.trim(), 
          country: s.country, 
          tags: s.tags ? s.tags.toLowerCase() : '',
          lat: parseFloat(s.geo_lat), 
          lng: parseFloat(s.geo_long), 
          url: s.url_resolved 
        })).filter(s => 
          !isNaN(s.lat) && !isNaN(s.lng) && 
          Math.abs(s.lat) <= 90 && Math.abs(s.lng) <= 180 &&
          !(Math.abs(s.lat) < 0.1 && Math.abs(s.lng) < 0.1)
        );

        world.pointsData(stations);
        tuneNearestToCenter();
        updateFavoritesUI();
      });

    function tuneStation(station) {
      if (!station) return;
      currentStation = station;

      const distFromBariloche = getKilometers(BARILOCHE.lat, BARILOCHE.lng, station.lat, station.lng);

      document.getElementById('name').innerText = station.name;
      document.getElementById('country').innerText = `📍 ${station.country}`;
      document.getElementById('distance').innerText = `📐 A ${distFromBariloche.toLocaleString('es-AR')} km de Bariloche`;

      world.arcsData([{
        startLat: BARILOCHE.lat, startLng: BARILOCHE.lng,
        endLat: station.lat, endLng: station.lng
      }]);

      audio.src = station.url;
      audio.play().then(() => setPlayingState(true)).catch(() => setPlayingState(false));
      updateFavoritesUI();
    }

    function tuneNearestToCenter() {
      const activeList = stations.filter(s => isMatchGenre(s));
      if (!activeList.length) return;
      
      const center = world.pointOfView();
      let nearest = null, minCenterDist = Infinity;

      for (const s of activeList) {
        const d = getKilometers(center.lat, center.lng, s.lat, s.lng);
        if (d < minCenterDist) { 
          minCenterDist = d; 
          nearest = s; 
        }
      }
      if (nearest) tuneStation(nearest);
    }

    function playRandomStation() {
      const activeList = stations.filter(s => isMatchGenre(s));
      if (!activeList.length) return;
      const randomIdx = Math.floor(Math.random() * activeList.length);
      const station = activeList[randomIdx];
      flyAndTune(station);
    }

    function filterByGenre(genre) {
      selectedGenre = genre;
      world.pointColor(s => isMatchGenre(s) ? '#00f0ff' : 'rgba(0, 240, 255, 0.08)')
           .pointAltitude(s => isMatchGenre(s) ? 0.003 : 0.001)
           .pointRadius(s => isMatchGenre(s) ? 0.06 : 0.02);
    }

    document.getElementById('globe').addEventListener('dblclick', () => {
      tuneNearestToCenter();
    });

    function handleSearchKey(e) {
      const q = e.target.value.toLowerCase().trim();
      const dropdown = document.getElementById('searchResults');
      
      if (e.key === 'Enter') {
        if (!q) return;
        const matches = stations.filter(s => s.name.toLowerCase().includes(q) || s.country.toLowerCase().includes(q));
        if (matches.length > 0) {
          dropdown.style.display = 'none';
          flyAndTune(matches[0]);
        }
        return;
      }

      if (q.length >= 2) {
        const matches = stations.filter(s => s.name.toLowerCase().includes(q) || s.country.toLowerCase().includes(q)).slice(0, 5);
        if (matches.length > 0) {
          dropdown.innerHTML = matches.map(s => `<div class="results-item" onclick="selectSearchItem('${s.url}')">📻 ${s.name} (${s.country})</div>`).join('');
          dropdown.style.display = 'block';
        } else {
          dropdown.style.display = 'none';
        }
      } else {
        dropdown.style.display = 'none';
      }
    }

    function selectSearchItem(url) {
      const station = stations.find(s => s.url === url);
      if (station) {
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('searchInput').value = station.name;
        flyAndTune(station);
      }
    }

    function flyAndTune(station) {
      world.pointOfView({ lat: station.lat, lng: station.lng, altitude: 0.8 }, 2000);
      setTimeout(() => tuneStation(station), 2100);
    }

    function setPlayingState(isPlaying) {
      document.getElementById('playBtn').innerText = isPlaying ? '⏸ Pausa' : '▶ Reprod.';
      document.getElementById('eqBars').style.display = isPlaying ? 'flex' : 'none';
    }

    function toggleAudio() {
      if (audio.paused) { audio.play(); setPlayingState(true); }
      else { audio.pause(); setPlayingState(false); }
    }

    function locateBariloche() {
      world.pointOfView({ lat: BARILOCHE.lat, lng: BARILOCHE.lng, altitude: 0.9 }, 2000);
      setTimeout(tuneNearestToCenter, 2100);
    }

    function toggleFavorite() {
      if (!currentStation) return;
      const index = favorites.findIndex(f => f.url === currentStation.url);
      if (index >= 0) { favorites.splice(index, 1); }
      else { favorites.push({ name: currentStation.name, country: currentStation.country, lat: currentStation.lat, lng: currentStation.lng, url: currentStation.url }); }
      localStorage.setItem('myRadioFavorites', JSON.stringify(favorites));
      updateFavoritesUI();
    }

    function updateFavoritesUI() {
      const favBtn = document.getElementById('favBtn');
      const favList = document.getElementById('favList');
      if (currentStation) {
        const isFav = favorites.some(f => f.url === currentStation.url);
        favBtn.classList.toggle('active', isFav);
        favBtn.innerText = isFav ? '♥ Guardado' : '♡ Guardar';
      }
      favList.innerHTML = favorites.length === 0 ? '<p style="font-size:11px; color:#666; margin:0;">Sin favoritos</p>' : '';
      favorites.forEach((fav) => {
        const div = document.createElement('div');
        div.className = 'fav-item';
        div.innerHTML = `<span onclick="flyAndTune(${JSON.stringify(fav).replace(/"/g, '&quot;')})" style="cursor:pointer">📻 ${fav.name}</span>`;
        favList.appendChild(div);
      });
    }
  </script>
</body>
</html>
